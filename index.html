<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAINROT GO</title>
    <!-- OpenStreetMap Leaflet Engine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        .hud {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(10, 10, 10, 0.85); border: 2px solid #00ff00;
            border-radius: 10px; padding: 12px 16px; color: #fff;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4); font-family: monospace;
        }
        .hud h1 { font-size: 1.2rem; color: #00ff00; text-shadow: 0 0 5px #00ff00; margin-bottom: 5px; }
        .hud p { font-size: 0.8rem; margin: 3px 0; color: #ccc; }

        .hud-buttons {
            position: absolute; bottom: 20px; right: 20px; z-index: 1000;
            display: flex; gap: 10px;
        }

        .btn-hud {
            background: #00ff00; color: #000; border: none; padding: 12px 20px;
            font-size: 1rem; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 15px #00ff00; font-family: monospace; transition: transform 0.1s;
        }
        .btn-hud:active { transform: scale(0.95); }

        /* 🏟️ 3D BATTLE ARENA OVERLAY */
        #battleModal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 99999; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%);
            backdrop-filter: blur(10px); flex-direction: column; justify-content: space-between;
            padding: 20px; color: #fff;
        }
        .battle-header { text-align: center; margin-top: 10px; }
        .battle-header h2 { font-size: 1.8rem; color: #ff007f; text-shadow: 0 0 12px #ff007f; }

        .battle-arena-field {
            flex: 1; position: relative; width: 100%; max-width: 600px;
            margin: 0 auto; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px 0; perspective: 600px;
        }
        .platform {
            position: absolute; width: 170px; height: 75px; border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 255, 128, 0.3) 0%, rgba(0, 255, 128, 0) 70%);
            border: 2px solid rgba(0, 255, 128, 0.4); box-shadow: 0 0 20px rgba(0, 255, 128, 0.3);
            transform: rotateX(60deg);
        }
        .platform-wild { top: 110px; right: 30px; border-color: rgba(255, 0, 127, 0.5); background: radial-gradient(ellipse at center, rgba(255, 0, 127, 0.3) 0%, rgba(255, 0, 127, 0) 70%); }
        .platform-player { bottom: 60px; left: 30px; }

        .combatant {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .combatant-wild { top: 30px; right: 40px; }
        .combatant-player { bottom: 65px; left: 45px; }

        .sprite-hero { font-size: 5.5rem; filter: drop-shadow(0 15px 10px rgba(0,0,0,0.7)); transition: transform 0.2s; }

        .hp-badge {
            background: rgba(10, 10, 10, 0.85); border: 2px solid #ff007f;
            border-radius: 12px; padding: 8px 14px; min-width: 160px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: monospace;
        }
        .hp-bar-outer { width: 100%; height: 12px; background: #222; border-radius: 6px; overflow: hidden; border: 1px solid #444; margin: 4px 0; }
        .hp-bar-inner { height: 100%; background: #00ff00; width: 100%; transition: width 0.3s ease-out; }

        .dmg-popup {
            position: absolute; font-size: 2rem; font-weight: bold; color: #ff0055;
            text-shadow: 0 0 8px #000, 2px 2px 0 #fff; animation: floatUp 0.8s ease-out forwards; pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-30px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-60px) scale(1); }
        }

        .charge-attack { transform: translate(140px, -120px) scale(1.3) !important; }
        .hit-knockback { transform: translate(20px, -20px) scale(0.9) !important; filter: brightness(2) drop-shadow(0 0 15px #ff0000) !important; }

        .battle-controls { max-width: 500px; width: 100%; margin: 0 auto 10px auto; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        .btn-action { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; font-family: monospace; transition: transform 0.1s; }
        .btn-action:active { transform: scale(0.98); }

        /* Rot-Dex Storage Modal */
        #dexModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000;
            background: rgba(15, 15, 15, 0.95); border: 3px solid #ff007f; border-radius: 15px; padding: 20px;
            text-align: center; color: #fff; box-shadow: 0 0 25px rgba(255, 0, 127, 0.6); width: 90%; max-width: 420px;
        }
        #dexGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 300px; overflow-y: auto; margin-top: 15px; padding-right: 5px; }
        .close-x-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #ff007f; font-size: 1.5rem; cursor: pointer; font-weight: bold; }

        /* Player SVG Animations */
        .player-container { width: 65px; height: 85px; filter: drop-shadow(0 0 8px rgba(0, 255, 0, 0.6)); }
        .character-svg { width: 100%; height: 100%; overflow: visible; }
        .facing-left .body-group { transform-origin: center; transform: scaleX(-1); }
        .facing-up .face-features { display: none; }
        .facing-up .back-hair { display: block !important; }
        .walking .left-leg { animation: walkLegLeft 0.35s infinite alternate ease-in-out; transform-origin: 20px 42px; }
        .walking .right-leg { animation: walkLegRight 0.35s infinite alternate ease-in-out; transform-origin: 29px 42px; }
        @keyframes walkLegLeft { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-5px) rotate(-18deg); } }
        @keyframes walkLegRight { 0% { transform: translateY(-5px) rotate(18deg); } 100% { transform: translateY(0px) rotate(0deg); } }

        .leaflet-marker-pane .custom-brainrot-pin { pointer-events: auto !important; z-index: 9999 !important; }
    </style>
</head>
<body>

    <!-- HUD Overlay -->
    <div class="hud">
        <h1>🔄 BRAINROT GO</h1>
        <p>🎮 <b>CONTROLS:</b> WASD / Arrow Keys</p>
        <p>📍 <b>LAT:</b> <span id="latVal">Loading...</span></p>
        <p>📍 <b>LNG:</b> <span id="lngVal">Loading...</span></p>
        <hr style="margin: 8px 0; border-color: #333;">
        <p>📦 <b>CAUGHT:</b> <span id="inventoryCount">0</span> Brainrots</p>
        <p>💰 <b>ROT BALANCE:</b> <span id="rotBalance">500</span></p>
    </div>

    <!-- HUD Buttons -->
    <div class="hud-buttons">
        <button class="btn-hud" onclick="openDex()">📦 ROT-DEX (<span id="dexCount">0</span>/<span id="totalBrainrots">0</span>)</button>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- 🏟️ 3D BATTLE ARENA OVERLAY -->
    <div id="battleModal">
        <div class="battle-header">
            <h2 id="wildName">WILD ANOMALY!</h2>
            <p id="wildRarity" style="color: #ffcc00; font-family: monospace; font-size: 0.85rem;">RARITY: LEGENDARY</p>
        </div>

        <div id="arenaField" class="battle-arena-field">
            <div class="platform platform-wild"></div>
            <div class="platform platform-player"></div>

            <div id="wildCombatant" class="combatant combatant-wild">
                <div class="hp-badge" style="border-color: #ff007f;">
                    <div style="font-weight: bold; font-size: 0.85rem;" id="wildBadgeName">WILD TARGET</div>
                    <div class="hp-bar-outer"><div id="wildHpBar" class="hp-bar-inner" style="background: #ff0055;"></div></div>
                    <div id="wildHpText" style="font-size: 0.65rem; color: #aaa; text-align: right;">100/100 HP</div>
                </div>
                <div id="wildSprite" class="sprite-hero">🦈</div>
            </div>

            <div id="playerCombatant" class="combatant combatant-player">
                <div id="myFighterSprite" class="sprite-hero">🚽</div>
                <div class="hp-badge" style="border-color: #00ff00;">
                    <div id="myFighterName" style="font-weight: bold; font-size: 0.85rem;">Skibidi (Lvl 1)</div>
                    <div class="hp-bar-outer"><div id="myHpBar" class="hp-bar-inner"></div></div>
                    <div id="myHpText" style="font-size: 0.65rem; color: #aaa;">50/50 HP</div>
                </div>
            </div>
        </div>

        <div id="battleLog" style="font-size: 0.9rem; color: #00ff00; font-family: monospace; text-align: center; margin-bottom: 8px; min-height: 24px;">
            Prepare for battle!
        </div>

        <div class="battle-controls">
            <button id="attackBtn" class="btn-action" style="background: #ff0055; color: #fff;" onclick="battleAttack()">⚔️ ATTACK WILD BRAINROT</button>
            <button id="vaultCatchBtn" class="btn-action" style="background: #00ff00; color: #000;" onclick="battleCatch()">🔒 DEFEAT TO UNLOCK VAULT</button>
            <button class="btn-action" style="background: #333; color: #fff;" onclick="closeBattle()">🏃 FLEE BATTLE</button>
        </div>
    </div>

    <!-- Rot-Dex Storage Modal -->
    <div id="dexModal">
        <button class="close-x-btn" onclick="closeDex()">✖</button>
        <h2 style="color: #00ff00; font-size: 1.5rem; margin-bottom: 10px; text-shadow: 0 0 10px #00ff00;">📦 THE ROT-DEX</h2>
        <div id="dexGrid"></div>
        <button class="btn-action" style="background: #ff007f; color: #fff; margin-top: 15px;" onclick="closeDex()">CLOSE ROT-DEX</button>
    </div>

    <!-- Modular Game Logic Scripts -->
    <script src="database.js"></script>
    <script src="collision.js"></script>
    <script src="player.js"></script>
    <script src="dex.js"></script>
    <script src="battle.js"></script>
    <script src="spawner.js"></script>
    <script src="main.js"></script>
</body>
</html>
