<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAINROT GO - Play Now</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            color: #fff;
        }
        /* Background map/scene simulation with dark overlay */
        .bg-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            filter: blur(4px) brightness(0.3);
            z-index: -1;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 30px 20px;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        /* Top Active Players Badge */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }
        .player-badge {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
        .green-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Center Branding & Action */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }
        .game-title {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #f3f0d5;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            margin-bottom: 4px;
        }
        .game-subtitle {
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: #d1cca1;
            margin-bottom: 35px;
            font-weight: bold;
        }
        .play-btn {
            background: linear-gradient(135deg, #7bff9e, #34d36e);
            color: #0a2312;
            font-size: 1.4rem;
            font-weight: 900;
            padding: 16px 0;
            width: 85%;
            max-width: 280px;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(52, 211, 110, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .play-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 15px rgba(52, 211, 110, 0.2);
        }
        .instructions {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        
        /* Contract Address Pill */
        .ca-pill {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: border-color 0.2s;
        }
        .ca-pill:hover {
            border-color: #34d36e;
        }
        .ca-label {
            color: #34d36e;
            font-weight: bold;
        }
        .ca-value {
            color: #ccc;
        }

        /* Bottom Social Icons */
        .social-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }
        .social-icon {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
            backdrop-filter: blur(5px);
            transition: transform 0.2s, border-color 0.2s;
        }
        .social-icon:hover {
            transform: scale(1.1);
            border-color: #34d36e;
        }
    </style>
</head>
<body>

    <div class="bg-scene"></div>

    <div class="container">
        <!-- Top Active Players -->
        <div class="top-bar">
            <div class="player-badge">
                <div class="green-dot"></div>
                <span id="playerCount">482</span> players
            </div>
        </div>

        <!-- Center Content -->
        <div class="center-content">
            <div class="game-title">BRAINROT GO</div>
            <div class="game-subtitle">GEOLOCATION MAP RPG</div>

            <button class="play-btn" onclick="startGame()">Play Now</button>
            
            <div class="instructions">
                Explore the map, capture rots, and battle in gyms.<br>
                Secure cloud account sync enabled.
            </div>

            <!-- Contract Address / Token Info Pill -->
            <div class="ca-pill" onclick="copyCA()">
                <span class="ca-label">$ROT CA</span>
                <span class="ca-value" id="caText">8Byg...Qpump</span>
                <span>📋</span>
            </div>
        </div>

        <!-- Bottom Social Links -->
        <div class="social-bar">
            <a href="https://your-docs-link.com" target="_blank" class="social-icon" title="Documentation">📖</a>
            <a href="https://twitter.com/yourhandle" target="_blank" class="social-icon" title="Twitter / X">𝕏</a>
            <a href="https://discord.gg/yourinvite" target="_blank" class="social-icon" title="Discord">💬</a>
        </div>
    </div>

    <script>
        // Simulate live player count fluctuations slightly
        setInterval(() => {
            const countEl = document.getElementById('playerCount');
            let current = parseInt(countEl.innerText);
            let change = Math.floor(Math.random() * 5) - 2; // -2 to +2
            countEl.innerText = Math.max(400, current + change);
        }, 4000);

        function startGame() {
            // Redirect to your main map/game file (e.g., index.html or map.html)
            window.location.href = 'index.html'; 
        }

        function copyCA() {
            const fullCA = "8BygVz9qpumpFakeContractAddressExample12345";
            navigator.clipboard.writeText(fullCA);
            
            const caText = document.getElementById('caText');
            caText.innerText = "Copied!";
            setTimeout(() => {
                caText.innerText = "8Byg...Qpump";
            }, 2000);
        }
    </script>
</body>
</html>
