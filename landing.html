<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAINROT GO - Play Now</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #0d1117;
            color: #fff;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        /* Top Active Players Badge */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }
        .player-badge {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(52, 211, 110, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .green-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Center Content & Banner Image */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            gap: 15px;
        }
        
        .banner-img {
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            border: 2px solid rgba(52, 211, 110, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .play-btn {
            background: linear-gradient(135deg, #7bff9e, #34d36e);
            color: #0a2312;
            font-size: 1.3rem;
            font-weight: 900;
            padding: 14px 0;
            width: 100%;
            max-width: 280px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: `0 6px 20px rgba(52, 211, 110, 0.4)`;
            transition: transform 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .play-btn:active {
            transform: scale(0.96);
        }
        
        /* Contract Address Pill */
        .ca-pill {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .ca-label {
            color: #34d36e;
            font-weight: bold;
        }
        .ca-value {
            color: #ccc;
        }

        /* Bottom Nav (Docs & Socials) */
        .social-bar {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }
        .nav-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.2s;
        }
        .nav-btn:hover {
            border-color: #34d36e;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Active Players -->
        <div class="top-bar">
            <div class="player-badge">
                <div class="green-dot"></div>
                <span id="playerCount">482</span> players live
            </div>
        </div>

        <!-- Center Content with Direct Banner Image -->
        <div class="center-content">
            <!-- Directly displays your generated character banner image -->
            <img src="homescreen.png" alt="Brainrot Go Banner" class="banner-img" onerror="this.onerror=null; this.src='brainrot/homescreen.png';">

            <button class="play-btn" onclick="startGame()">Play Now</button>

            <!-- Contract Address Pill -->
            <div class="ca-pill" onclick="copyCA()">
                <span class="ca-label">$ROT CA</span>
                <span class="ca-value" id="caText">8Byg...Qpump</span>
                <span>📋</span>
            </div>
        </div>

        <!-- Bottom Navigation Links -->
        <div class="social-bar">
            <a href="docs.html" class="nav-btn">📄 Game Docs</a>
            <a href="https://twitter.com" target="_blank" class="nav-btn">𝕏 Twitter</a>
            <a href="https://discord.com" target="_blank" class="nav-btn">💬 Discord</a>
        </div>
    </div>

    <script>
        // Live player count ticker
        setInterval(() => {
            const countEl = document.getElementById('playerCount');
            let current = parseInt(countEl.innerText);
            let change = Math.floor(Math.random() * 5) - 2;
            countEl.innerText = Math.max(400, current + change);
        }, 4000);

        function startGame() {
            window.location.href = 'index.html'; 
        }

        function copyCA() {
            const fullCA = "8BygVz9qpumpFakeContractAddressExample12345";
            navigator.clipboard.writeText(fullCA);
            const caText = document.getElementById('caText');
            caText.innerText = "Copied!";
            setTimeout(() => {
                caText.innerText = "8Byg...Qpump";
            }, 2000);
        }
    </script>
</body>
</html>
